[package]
name = "vestra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "vestra"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vestra"
path = "src/bin/vestra.rs"

[[bin]]
name = "vestra-lab"
path = "src/bin/vestra-lab.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
vestra-engine.workspace = true
vestra-core = { path = "../vestra-core" }
vestra-studio = { path = "../vestra-studio" }

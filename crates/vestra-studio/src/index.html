<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vestra Studio</title>
  <style>
    :root { --ink:#11100e; --paper:#e6dfd2; --muted:#958e82; --line:#39362f; --ember:#e6653e; --signal:#69d2c4; }
    * { box-sizing:border-box; } body { margin:0; overflow:hidden; color:var(--paper); background:var(--ink); font-family:ui-monospace, Menlo, monospace; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.18; background-image:radial-gradient(#fff 0.45px, transparent .6px); background-size:5px 5px; mix-blend-mode:soft-light; }
    canvas { position:fixed; inset:0; width:100vw; height:100vh; cursor:grab; } canvas:active { cursor:grabbing; }
    header { position:fixed; top:0; left:0; right:0; display:flex; align-items:flex-start; justify-content:space-between; padding:28px 32px; pointer-events:none; }
    .brand { font: 700 clamp(2rem,4vw,4.7rem)/.78 Georgia,serif; letter-spacing:-.07em; animation:arrive .8s both; } .brand span { color:var(--ember); }
    .sub { margin-top:14px; color:var(--muted); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
    .hud { width:255px; padding:16px; border:1px solid var(--line); background:rgba(17,16,14,.72); backdrop-filter:blur(12px); pointer-events:auto; animation:arrive .8s .13s both; }
    .hud h2 { margin:0 0 12px; font:700 12px Georgia,serif; letter-spacing:.06em; text-transform:uppercase; } .row { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:10px; } .row b { color:var(--signal); font-weight:500; }
    .badge { display:inline-flex; gap:7px; align-items:center; padding:7px 9px; background:#1b2421; border:1px solid #345c57; color:var(--signal); font-size:9px; text-transform:uppercase; letter-spacing:.12em; }
    button { width:100%; margin-top:12px; padding:8px 9px; border:1px solid var(--line); background:transparent; color:var(--paper); font:9px ui-monospace,Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; } button:hover,button[data-active="true"] { border-color:var(--ember); color:var(--ember); }
    .dot { width:6px; height:6px; border-radius:50%; background:var(--signal); box-shadow:0 0 12px var(--signal); }
    footer { position:fixed; bottom:27px; left:32px; right:32px; display:flex; justify-content:space-between; color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; pointer-events:none; }
    .loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--ink); z-index:2; transition:opacity .55s; } .loading p { color:var(--signal); letter-spacing:.2em; font-size:10px; animation:pulse 1s infinite alternate; }
    @keyframes arrive { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } } @keyframes pulse { to { opacity:.35; } }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <div class="loading" id="loading"><p>assembling coherent world</p></div>
  <header><div><div class="brand">ves<span>t</span>ra</div><div class="sub" id="layer">Coherent World / Measured Layer</div></div><aside class="hud"><h2>Scene ledger</h2><div class="badge"><i class="dot"></i> <span id="kind">measured evidence</span></div><div class="row"><span>points</span><b id="points">—</b></div><div class="row"><span>windows</span><b id="windows">—</b></div><div class="row"><span>segments</span><b id="segments">—</b></div><div class="row"><span>seams</span><b id="seams">—</b></div><div class="row"><span>min inliers</span><b id="inliers">—</b></div><div class="row"><span>loops</span><b id="loops">—</b></div><div class="row"><span>scale</span><b id="scale">relative</b></div><div class="row"><span>capture</span><b id="capture">—</b></div><div class="row"><span>controls</span><b>drag · scroll · c</b></div><button id="layers" data-active="false">show measured evidence</button><button id="cameras" data-active="false">show camera rays</button></aside></header>
  <footer><span>Vestra Studio / Local only</span><span id="status">loading chunks</span></footer>
  <script>
  const canvas=document.querySelector('#world'), gl=canvas.getContext('webgl',{antialias:true,alpha:false});
  const vertex=`attribute vec3 p; attribute vec3 c; attribute vec3 n; uniform mat4 m; uniform float s; varying vec3 v; varying vec3 w; void main(){gl_Position=m*vec4(p,1.);gl_PointSize=s;v=c;w=n;}`;
  const fragment=`precision mediump float; varying vec3 v; varying vec3 w; void main(){vec2 q=gl_PointCoord-.5;if(dot(q,q)>.25)discard;float facing=dot(normalize(w+vec3(.0001)),normalize(vec3(.35,.72,.56)));float light=.42+.58*max(facing,0.);gl_FragColor=vec4(v*light,1.);}`;
  const lineVertex=`attribute vec3 p; attribute vec3 c; uniform mat4 m; varying vec3 v; void main(){gl_Position=m*vec4(p,1.);v=c;}`;
  const lineFragment=`precision mediump float; varying vec3 v; void main(){gl_FragColor=vec4(v,1.);}`;
  function shader(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x} const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(prog);const lineProg=gl.createProgram();gl.attachShader(lineProg,shader(gl.VERTEX_SHADER,lineVertex));gl.attachShader(lineProg,shader(gl.FRAGMENT_SHADER,lineFragment));gl.linkProgram(lineProg);gl.useProgram(prog);
  let yaw=.65,pitch=-.2,distance=3,drag=null,batches=[],cameraBatches=[],cameraRays=[],showCameras=false,pointCount=0,center=[0,0,0],extent=1,lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity],rendering=false,manifestState=null,showingFused=false,fusedUrls=[],fusedBinary=false;
  function multiply(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
  function perspective(f,a,n,f2){let q=1/Math.tan(f/2),d=1/(n-f2);return new Float32Array([q/a,0,0,0,0,q,0,0,0,0,(f2+n)*d,-1,0,0,2*f2*n*d,0])}
  function view(){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),e=[center[0]+distance*cp*sy,center[1]+distance*sp,center[2]+distance*cp*cy],z=[e[0]-center[0],e[1]-center[1],e[2]-center[2]],l=Math.hypot(...z);z=z.map(v=>v/l);let x=[z[2],0,-z[0]],xl=Math.hypot(...x);x=x.map(v=>v/xl);let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1])}
  function upload(points){
    const positions=[],colors=[],normals=[];
    for(const p of points){positions.push(...p.position);colors.push(...p.color_srgb.map(x=>x/255));normals.push(...(p.normal||[0,0,1]));for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p.position[i]);hi[i]=Math.max(hi[i],p.position[i])}}
    const make=(values,name)=>{const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(values),gl.STATIC_DRAW);return {buffer,location:gl.getAttribLocation(prog,name)}};
    batches.push({p:make(positions,'p'),c:make(colors,'c'),n:make(normals,'n'),count:points.length});pointCount+=points.length;
  }
  function uploadBinary(buffer){
    const view=new DataView(buffer);if(view.byteLength<12||String.fromCharCode(...new Uint8Array(buffer,0,4))!=='VSPT')throw new Error('invalid binary surfel chunk');const version=view.getUint16(4,true),stride=view.getUint16(6,true),count=view.getUint32(8,true);if(version!==1||stride!==40||12+count*stride!==view.byteLength)throw new Error('unsupported binary surfel chunk');const positions=[],colors=[],normals=[];for(let index=0,offset=12;index<count;index++,offset+=stride){const p=[view.getFloat32(offset,true),view.getFloat32(offset+4,true),view.getFloat32(offset+8,true)];positions.push(...p);normals.push(view.getFloat32(offset+12,true),view.getFloat32(offset+16,true),view.getFloat32(offset+20,true));colors.push(view.getUint8(offset+24)/255,view.getUint8(offset+25)/255,view.getUint8(offset+26)/255);for(let axis=0;axis<3;axis++){lo[axis]=Math.min(lo[axis],p[axis]);hi[axis]=Math.max(hi[axis],p[axis])}}const make=(values,name)=>{const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(values),gl.STATIC_DRAW);return {buffer,location:gl.getAttribLocation(prog,name)}};batches.push({p:make(positions,'p'),c:make(colors,'c'),n:make(normals,'n'),count});pointCount+=count;
  }
  function clearCameraRays(){for(const batch of cameraBatches){gl.deleteBuffer(batch.p.buffer);gl.deleteBuffer(batch.c.buffer)}cameraBatches=[]}
  function rebuildCameraRays(){clearCameraRays();if(!cameraRays.length)return;const positions=[],colors=[];const length=Math.max(extent*.055,.015);for(const ray of cameraRays){const end=ray.origin.map((v,i)=>v+ray.forward[i]*length);positions.push(...ray.origin,...end);colors.push(.9,.24,.12,.9,.24,.12)}const make=(values,name)=>{const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(values),gl.STATIC_DRAW);return {buffer,location:gl.getAttribLocation(lineProg,name)}};cameraBatches.push({p:make(positions,'p'),c:make(colors,'c'),count:positions.length/3})}
  function clearWorld(){for(const batch of batches)for(const key of ['p','c','n'])gl.deleteBuffer(batch[key].buffer);batches=[];pointCount=0;lo=[Infinity,Infinity,Infinity];hi=[-Infinity,-Infinity,-Infinity]}
  async function loadLayer(urls,binary,fused){clearWorld();for(let index=0;index<urls.length;index++){const response=await fetch(urls[index]);if(!response.ok)throw new Error('chunk fetch failed');if(binary)uploadBinary(await response.arrayBuffer());else{const chunk=await response.json();upload(chunk.points||chunk.views.flatMap(v=>v.points))}center=lo.map((v,i)=>(v+hi[i])/2);extent=Math.max(...hi.map((v,i)=>v-lo[i]),.1);distance=extent*1.8;document.querySelector('#points').textContent=pointCount.toLocaleString();document.querySelector('#status').textContent='revealing '+(index+1)+' / '+urls.length+' chunks';if(!rendering){rendering=true;render()}await new Promise(requestAnimationFrame)}rebuildCameraRays();showingFused=fused;document.querySelector('#kind').textContent=fused?'fused relative world':'measured evidence';document.querySelector('#layer').textContent=fused?'Coherent World / Fused Layer':'Coherent World / Measured Layer';document.querySelector('#segments').textContent=urls.length;const button=document.querySelector('#layers');button.dataset.active=String(!fused);button.textContent=fused?'show measured evidence':'show fused world';document.querySelector('#status').textContent='drag to orbit'}
  async function toggleLayer(){if(!manifestState?.fused_chunk_hash)return;const button=document.querySelector('#layers');button.disabled=true;try{if(showingFused){await loadLayer(manifestState.measured_chunk_hashes.map(h=>'/chunks/'+h+'.json'),false,false)}else{await loadLayer(fusedUrls,fusedBinary,true)}}finally{button.disabled=false}}
  function bind(attribute){gl.bindBuffer(gl.ARRAY_BUFFER,attribute.buffer);gl.enableVertexAttribArray(attribute.location);gl.vertexAttribPointer(attribute.location,3,gl.FLOAT,false,0,0)}
  async function boot(){
    const manifest=await (await fetch('/manifest.json')).json();manifestState=manifest;
    const hasFused=Boolean(manifest.fused_chunk_hash),binary=hasFused&&manifest.fused_point_binary_chunk_hashes?.length,progressive=hasFused&&manifest.fused_point_chunk_hashes?.length;
    const urls=binary?manifest.fused_point_binary_chunk_hashes.map(h=>'/chunks/points-'+h+'.bin'):progressive?manifest.fused_point_chunk_hashes.map(h=>'/chunks/points-'+h+'.json'):hasFused?['/chunks/fused-'+manifest.fused_chunk_hash+'.json']:manifest.measured_chunk_hashes.map(h=>'/chunks/'+h+'.json');fusedUrls=hasFused?urls:[];fusedBinary=Boolean(binary);
    const summary=manifest.fused_summary;document.querySelector('#windows').textContent=manifest.measured_chunk_hashes.length;document.querySelector('#segments').textContent=urls.length;document.querySelector('#scale').textContent=manifest.scale;document.querySelector('#capture').textContent=manifest.capture_quality?.disposition||'unknown';document.querySelector('#seams').textContent=summary?.sequential_alignment_count??'—';document.querySelector('#inliers').textContent=summary?.minimum_sequential_inlier_ratio==null?'—':(summary.minimum_sequential_inlier_ratio*100).toFixed(1)+'%';document.querySelector('#loops').textContent=summary?.loop_closure_count??'—';
    if(!hasFused)document.querySelector('#layers').style.display='none';await loadLayer(urls,Boolean(binary),hasFused);
    const evidence=await (await fetch('/evidence.json')).json();cameraRays=evidence.camera_rays||[];rebuildCameraRays();document.querySelector('#status').textContent='drag to orbit';document.querySelector('#loading').style.opacity=0;setTimeout(()=>document.querySelector('#loading').remove(),600)}
  function render(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.067,.063,.055,1);gl.clear(gl.COLOR_BUFFER_BIT);const matrix=multiply(perspective(.9,canvas.width/canvas.height,.01,extent*20),view());gl.useProgram(prog);gl.uniformMatrix4fv(gl.getUniformLocation(prog,'m'),false,matrix);gl.uniform1f(gl.getUniformLocation(prog,'s'),Math.max(1.2,3.5*devicePixelRatio));for(const batch of batches){bind(batch.p);bind(batch.c);bind(batch.n);gl.drawArrays(gl.POINTS,0,batch.count)}if(showCameras){gl.useProgram(lineProg);gl.uniformMatrix4fv(gl.getUniformLocation(lineProg,'m'),false,matrix);for(const batch of cameraBatches){gl.bindBuffer(gl.ARRAY_BUFFER,batch.p.buffer);gl.enableVertexAttribArray(batch.p.location);gl.vertexAttribPointer(batch.p.location,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,batch.c.buffer);gl.enableVertexAttribArray(batch.c.location);gl.vertexAttribPointer(batch.c.location,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.LINES,0,batch.count)}}requestAnimationFrame(render)}
  function toggleCameras(){showCameras=!showCameras;document.querySelector('#cameras').dataset.active=String(showCameras);document.querySelector('#cameras').textContent=showCameras?'hide camera rays':'show camera rays'}document.querySelector('#layers').onclick=()=>toggleLayer().catch(e=>{document.querySelector('#status').textContent='could not switch layer';console.error(e)});document.querySelector('#cameras').onclick=toggleCameras;canvas.onpointerdown=e=>drag=[e.clientX,e.clientY];addEventListener('pointerup',()=>drag=null);addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]});addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c')toggleCameras()});canvas.addEventListener('wheel',e=>{distance*=Math.exp(e.deltaY*.001);distance=Math.max(extent*.18,Math.min(extent*12,distance));e.preventDefault()},{passive:false});boot().catch(e=>{document.querySelector('#loading').innerHTML='<p>could not load scene: '+e.message+'</p>';console.error(e)});
  </script>
</body></html>

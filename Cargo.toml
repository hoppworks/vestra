[workspace]
resolver = "2"
members = ["crates/vestra-core", "crates/vestra-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
vestra-engine = { version = "0.1.0" }

# Local development override. Release builds replace this with the exact Git
# revision recorded in vestra.lock.toml.
[patch.crates-io]
vestra-engine = { path = "../vestra-engine/crates/da-engine" }
vestra-kernels = { path = "../vestra-kernels" }

[workspace]
resolver = "2"
members = ["crates/vestra-core", "crates/vestra-cli", "crates/vestra-studio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
thiserror = "2"
vestra-engine = { git = "https://github.com/hoppworks/vestra-engine", rev = "ec10ae38e8ceff3da4778fc2b47ad8f868dac311" }
